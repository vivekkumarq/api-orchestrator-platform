server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Vite fingerprints its asset filenames, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths must fall back to the shell, not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or a deploy is invisible until
    # the browser happens to revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
